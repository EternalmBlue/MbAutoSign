name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
            asset: MbAutoSign-windows-x64.zip
          - runner: ubuntu-22.04
            target: linux-x64
            asset: MbAutoSign-linux-x64.tar.gz
          - runner: ubuntu-22.04-arm
            target: linux-arm64
            asset: MbAutoSign-linux-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r packaging/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python packaging/build_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.ref_type == 'tag' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir release
          cp artifacts/windows-x64/MbAutoSign-windows-x64.zip release/
          cp artifacts/linux-x64/MbAutoSign-linux-x64.tar.gz release/
          cp artifacts/linux-arm64/MbAutoSign-linux-arm64.tar.gz release/
          cd release
          sha256sum MbAutoSign-* > SHA256SUMS
          cat > ../release-notes.md <<'NOTES'
          Download and extract the archive for your platform:

          - **Windows x64:** `MbAutoSign-windows-x64.zip` includes `MbAutoSign.exe` and `run-windows.ps1`.
          - **Linux x64:** `MbAutoSign-linux-x64.tar.gz` includes the native `MbAutoSign` executable and `run-linux.sh`.
          - **Linux ARM64:** `MbAutoSign-linux-arm64.tar.gz` includes the native `MbAutoSign` executable and `run-linux.sh`.

          Create `config.toml` next to the executable using `config.example.toml` as a reference. Python and its dependencies are included. Cloak Browser is downloaded from CloakHQ when no supported local copy is available.
          NOTES
          gh release create "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "MbAutoSign $RELEASE_TAG" \
            --notes-file ../release-notes.md
